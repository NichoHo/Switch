services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: switch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Loopback only: agora's Oracle deploy runs this file on a public host,
    # and these are default credentials.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    # Without a cap the JVM sizes its heap from the whole host's RAM.
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
      DB_HOST: postgres
      # Spring's relaxed env-var binding maps this to the acquirer.sim.url property that
      # routing/AcquirerDirectory and payment/api/PaymentController read (NR-11). Without it,
      # the container fell back to localhost:8081 (itself, not the acquirer-sim container).
      ACQUIRER_SIM_URL: http://acquirer-sim:8081
      # Set to enable tracing (see gateway/Dockerfile): agora's Jaeger,
      # reached over the host since this stack has its own compose network.
      #   OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      acquirer-sim:
        condition: service_started

  acquirer-sim:
    build:
      context: .
      dockerfile: acquirer-sim/Dockerfile
    ports:
      - "3002:8081"
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
      # Maps to gateway.url (NR-11): what AcsController posts its signed 3DS assertion to.
      # localhost inside this container is acquirer-sim itself, not the gateway.
      GATEWAY_URL: http://gateway:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
